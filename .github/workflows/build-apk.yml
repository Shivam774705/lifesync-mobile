name: Build Android APK (Free GitHub Actions)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for Android Builder (Free GitHub Runner)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI (Google's Official TWA APK Builder)
        run: npm install -g @bubblewrap/cli

      - name: Prepare APK Build Directory
        run: |
          mkdir -p build-apk
          cp -r index.html manifest.json sw.js icon-192.png icon-512.png css js build-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifesync-mobile-web-app
          path: build-apk/
